model:
  name: "mistralai/Mistral-7B-Instruct-v0.2"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_path: "use-cases/sentiment-analysis/dataset.jsonl"
  eval_path: "use-cases/sentiment-analysis/dataset.jsonl"
  format: "chat"
  max_seq_length: 512
  packing: false

training:
  output_dir: "use-cases/sentiment-analysis/out"
  num_train_epochs: 5
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 3e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  max_grad_norm: 0.3
  report_to: "none"

merge:
  output_dir: "use-cases/sentiment-analysis/merged"
  export_gguf: true
  gguf_quantization: "q4_k_m"