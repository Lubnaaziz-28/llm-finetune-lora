model:
  name: "codellama/CodeLlama-7b-Instruct-hf"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 32
  alpha: 64
  dropout: 0.1
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_path: "use-cases/code-generation/dataset.jsonl"
  eval_path: "use-cases/code-generation/dataset.jsonl"
  format: "chat"
  max_seq_length: 4096
  packing: false

training:
  output_dir: "use-cases/code-generation/out"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 10
  eval_steps: 25
  save_steps: 25
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  max_grad_norm: 0.3
  report_to: "none"

merge:
  output_dir: "use-cases/code-generation/merged"
  export_gguf: true
  gguf_quantization: "q4_k_m"