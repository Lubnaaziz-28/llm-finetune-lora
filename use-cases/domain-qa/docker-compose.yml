version: "3.9"

services:
  train:
    build:
      context: ../..
      dockerfile: Dockerfile
    volumes:
      - ../../use-cases/domain-qa:/app/use-cases/domain-qa
      - ../../out:/app/out
      - ../../configs:/app/configs
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - WANDB_MODE=offline
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      python src/train.py --config use-cases/domain-qa/config.yaml

  merge:
    build:
      context: ../..
      dockerfile: Dockerfile
    volumes:
      - ../../use-cases/domain-qa:/app/use-cases/domain-qa
      - ../../out:/app/out
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    command: >
      python src/merge_and_export.py --adapter use-cases/domain-qa/out --base mistralai/Mistral-7B-Instruct-v0.2 --output use-cases/domain-qa/merged --export-gguf
    profiles: ["export"]

  eval:
    build:
      context: ../..
      dockerfile: Dockerfile
    volumes:
      - ../../use-cases/domain-qa:/app/use-cases/domain-qa
      - ../../out:/app/out
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    command: >
      python src/evaluate.py --model use-cases/domain-qa/merged --eval-data use-cases/domain-qa/dataset.jsonl
    profiles: ["eval"]