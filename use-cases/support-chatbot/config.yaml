model:
  name: "mistralai/Mistral-7B-Instruct-v0.2"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_path: "use-cases/support-chatbot/dataset.jsonl"
  eval_path: "use-cases/support-chatbot/dataset.jsonl"
  format: "chat"
  max_seq_length: 2048
  packing: false

training:
  output_dir: "use-cases/support-chatbot/out"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  max_grad_norm: 0.3
  report_to: "none"

merge:
  output_dir: "use-cases/support-chatbot/merged"
  export_gguf: true
  gguf_quantization: "q4_k_m"